[project]
name = "ai-rmq"
version = "0.1.0"
description = "RabbitMQ connection, consumer, producer, and service infrastructure used by all AI services"
requires-python = ">=3.13"
dependencies = [
    "pika>=1.4.4",
    "pika-stubs>=0.1.3",
    "msgspec>=0.22.0",
    "numpy>=2.5.4",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"
