[project]
name = "ai-speech-recognition-service"
version = "0.1.0"
description = "Consumes audio capture messages to deciper the text of the speech in those audio samples, and publishes messages containing that text to a message queue" 
requires-python = ">=3.13"
dependencies = [
    "ai-common",
    "ai-rmq",
    "faster-whisper>=1.2.1",
    "numpy>=2.5.4",
    "resampy>=0.4.3",
    "silero-vad>=6.2.3"
]

[tool.uv]
override-dependencies = [
    "torch==2.9.0+cu129",
    "torchvision==0.24.0+cu129",
]

[tool.uv.sources]
ai-common = { path = "../../common" }
ai-rmq = { path = "../../rmq" }
torch = [
    { index = "pytorch-cu129"},
]
torchvision = [
    { index = "pytorch-cu129"},
]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true
