[project]
name = "ai-speech-synthesis-service"
version = "0.1.0"
description = "Consumes text from messages, synthesizes speech for that text, and publishes messages containing that speech to a message queue"
requires-python = ">=3.13"
dependencies = [
    "ai-common",
    "ai-rmq",
    "en-core-web-sm",
    "kokoro>=0.9.4",
    "numpy>=2.3.5",
]

[tool.uv]
override-dependencies = [
    "torch==2.9.0+cu129",
    "torchvision==0.24.0+cu129",
]

[tool.uv.sources]
ai-common = { path = "../../common" }
ai-rmq = { path = "../../rmq" }
torch = [
    { index = "pytorch-cu129"},
]
torchvision = [
    { index = "pytorch-cu129"},
]
en_core_web_sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }


[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true
