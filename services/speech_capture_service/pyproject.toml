[project]
name = "cgt-ai-speech-capture-service"
version = "0.1.0"
description = "Captures raw microphone audio, organizes audio chunks into a defined message structure, and sends them to the speech recognition service"
requires-python = ">=3.13"
dependencies = [
    "cgt-ai-core",
    "numpy>=2.3.4",
    "sounddevice>=0.5.3",
]

[tool.uv.sources]
cgt-ai-core = { path = "../../core" }
