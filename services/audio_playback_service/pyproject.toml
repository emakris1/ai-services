[project]
name = "cgt-ai-audio-playback-service"
version = "0.1.0"
description = "Consumes audio samples, optionally applies sound effects, and plays them out on the desired audio output device"
requires-python = ">=3.13"
dependencies = [
    "cgt-ai-core",
    "numpy>=2.3.4",
    "sounddevice>=0.5.3",
]

[tool.uv.sources]
cgt-ai-core = { path = "../../core" }
