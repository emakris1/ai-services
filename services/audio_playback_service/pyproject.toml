[project]
name = "ai-audio-playback-service"
version = "0.1.0"
description = "Consumes audio samples and plays them out on the desired audio output device"
requires-python = ">=3.13"
dependencies = [
    "ai-common",
    "ai-rmq",
    "numpy>=2.5.4",
    "resampy>=0.4.3",
    "sounddevice>=0.5.6",
]

[tool.uv.sources]
ai-common = { path = "../../common" }
ai-rmq = { path = "../../rmq" }
