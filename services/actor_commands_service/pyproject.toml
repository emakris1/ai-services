[project]
name = "ai-actor-commands-service"
version = "0.1.0"
description = "Converts spoken phrases to embeddings, maps those embeddings to preconfigured actions."
requires-python = ">=3.13"
dependencies = [
    "ai-common",
    "ai-rmq",
    "sentence-transformers>=6.2.0",
]

[tool.uv]
override-dependencies = [
    "torch==2.9.0+cu129",
    "torchvision==0.24.0+cu129",
]

[tool.uv.sources]
ai-common = { path = "../../common" }
ai-rmq = { path = "../../rmq" }
torch = [
    { index = "pytorch-cu129"},
]
torchvision = [
    { index = "pytorch-cu129"},
]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true