[project]
name = "ai-common"
version = "0.1.0"
description = "Messages, enums, configuration, and utility functions shared by multiple AI services"
requires-python = ">=3.13"
dependencies = [
    "ai-rmq",
    "msgspec>=0.22.0",
    "numpy>=2.5.4",
]

[tool.uv.sources]
ai-rmq = { path = "../rmq" }

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"
